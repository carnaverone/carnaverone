  <ellipse cx="1330" cy="270" rx="390" ry="300" fill="url(#aura)" filter="url(#blur)"/>
  <path d="M1030 0V560 M1060 0V560" stroke="#D2AE68" stroke-opacity=".12"/>
  <g fill="none" stroke="url(#gold)" stroke-opacity=".58">
