    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#0F172A" opacity=".045"/></pattern>
  </defs>
  <rect width="1400" height="330" rx="22" fill="url(#bg)"/>
  <rect width="1400" height="330" rx="22" fill="url(#dots)"/>

