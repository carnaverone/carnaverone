<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="330" viewBox="0 0 1400 330" role="img" aria-labelledby="title desc">
  <title id="title">Carnaverone Studio areas of work</title>
  <desc id="desc">Public-facing areas across software, AI, digital art, media, systems, research and open source.</desc>
  <defs>
