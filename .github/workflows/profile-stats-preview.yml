name: Carnaverone Profile Stats Preview

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Add Dracula stats to README
        run: |
          marker='<!-- CARNAVERONE-GITHUB-STATS -->'
          if ! grep -q "$marker" README.md; then
            cat >> README.md <<'EOF'

---

<!-- CARNAVERONE-GITHUB-STATS -->
## 📊 GitHub Activity

<p align="center">
  <img src="https://github-readme-stats.vercel.app/api?username=carnaverone&show_icons=true&theme=dracula&hide_border=true" alt="Carnaverone GitHub Stats" width="49%" />
  <img src="https://github-readme-stats.vercel.app/api/top-langs/?username=carnaverone&layout=compact&theme=dracula&hide_border=true" alt="Carnaverone Top Languages" width="49%" />
</p>

<p align="center">
  <img src="https://github-readme-activity-graph.vercel.app/graph?username=carnaverone&theme=dracula&hide_border=true&area=true&custom_title=Carnaverone%20Activity" alt="Carnaverone GitHub Activity Graph" width="100%" />
</p>

## 🧬 Contribution Matrix

<p align="center">
  <img src="./profile-3d-contrib/profile-night-view.svg" alt="Carnaverone 3D Contribution Matrix" width="100%" />
</p>
EOF
          fi

          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git rm .github/workflows/profile-stats-preview.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: add Dracula GitHub profile graphs"
          git push
